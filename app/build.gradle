plugins { id 'com.android.application' }
android {
    namespace 'id.desa.dokumentasirumah'
    compileSdk 36
    defaultConfig {
        applicationId 'id.desa.dokumentasirumah'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '2.11.1'
        testInstrumentationRunner 'id.desa.dokumentasirumah.CompressionInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    signingConfigs { debug { storeFile file('../debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation 'androidx.camera:camera-core:1.4.1'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
